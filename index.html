<style>
:root{--paper:#F3F4F6;--cell:#fff;--ink:#1B2230;--ink2:#4A5263;--ink3:#8A92A3;--line:rgba(27,34,48,.10);--cobalt:#1F3FC4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Wanted Sans Variable",Pretendard,system-ui,sans-serif;word-break:keep-all;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}

.lede{color:var(--ink2);font-size:15px;margin-bottom:20px}

.prompt{position:relative;margin-top:12px;background:var(--cell);border-radius:16px;border:1px solid var(--line)}

.copy:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.follow{display:block;margin-top:40px;text-align:center;background:var(--cell);border-radius:16px;padding:20px;color:var(--ink);text-decoration:none;font-weight:600}
.follow span{display:block;font-weight:400;font-size:14px;color:var(--ink2);margin-top:4px}
ul.list{list-style:none}
ul.list a{display:block;background:var(--cell);border-radius:14px;padding:16px 18px;margin-bottom:10px;color:var(--ink);text-decoration:none;font-weight:600}
