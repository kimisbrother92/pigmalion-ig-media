name: comment-responder
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub은 5분이 최소. 바쁠 땐 몇 분씩 늦게 돌기도 함
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python bot/responder.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
